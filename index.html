<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Onita Lombardi">
    <meta name="description" content="Este é um site para praticar o consumo de API">
    <meta name="keywords" content="API, CEP, E-Commerce">
    <title>E-Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="./src/assets/images/logo-favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./src/styles/style.css">
    <script src="./src/js/script.js" defer></script>
</head>
<body>
    
    <header>
        <img src="./src/assets/images/logo-header.svg" alt="Logo E-Commerce">
        <nav>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Produtos</a></li>
                <li><a href="">Sobre nós</a></li>
                <li><a href="">Contato</a></li>
            </ul>
        </nav>

        <nav>
            <a href="" class="btn-login btn">Login</a>
        </nav>
    </header>

    <main class="main-home">
        <img src="./src/assets/images/Product-home.svg" alt="MacBook Pro" class="img-main-home">
        <div class="main-home-content">
            <div class="container-reviews-home">
                <div class="container-stars">
                    <img src="./src/assets/images/star.svg" alt="Icone estrela">
                    <img src="./src/assets/images/star.svg" alt="Icone estrela">
                    <img src="./src/assets/images/star.svg" alt="Icone estrela">
                    <img src="./src/assets/images/star.svg" alt="Icone estrela">
                    <img src="./src/assets/images/star.svg" alt="Icone estrela">
                </div>
                <span class="num-stars">5.0 Estrelas</span>
                <span class="num-reviews">(21.671 avaliações)</span>
            </div>
            <h1>2020 Apple MacBook Pro with Apple M1 Chip (13-inch, 8GB RAM, 256GB SSD Storage) - Space Gray</h1>
            <div class="prices-home">
                <span class="price-blue">R$5.299,00</span>
                <span class="price-gray">R$17.000,00</span>
                <span class="price-yellow">24,3% OFF</span>
            </div>
            <form action="" class="form-main-home">
                <fieldset>
                    <legend>Cor</legend>
                    <div class="form-main-color">
                        <input type="radio" name="color" id="color1" checked>
                        <label for="color1" class=" color color1"></label>
                        <input type="radio" name="color" id="color2">
                        <label for="color2" class="color color2"></label>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-add-carrinho">Adicionar no carrinho</button>
            </form>
        </div>
    </main>

    <section class="section-info">
        <h2>Informações</h2>
        <form action="" class="form-info">

            <fieldset>
                <div class="campo-info">
                    <label for="nome">Nome completo:</label>
                    <input type="text" name="nome" id="nome" required>
                </div>

                <div class="campo-info">
                    <label for="cpf">CPF:</label>
                    <input type="text" name="cpf" id="cpf" maxlength="14"  required>                
                </div>

                <div class="campo-info">
                    <label for="cep">CEP:</label>
                    <input type="text" name="cep" id="cep"  maxlength="9" required>
                </div>

                <div class="campo-info">
                    <label for="rua">Rua:</label>
                    <input type="text" name="rua" id="rua" required>
                </div>

                <div class="campo-info">
                    <label for="numero">Número:</label>
                    <input type="text" name="numero" id="numero" required>
                </div>

                <div class="campo-info">
                    <label for="complemento">Complemento:</label>
                    <input type="text" name="complemento" id="complemento">
                </div>

                <div class="campo-info">
                    <label for="estado">Estado:</label>
                    <input type="text" name="estado" id="estado" required>
                </div>

                <div class="campo-info bairro">
                    <label for="bairro">Bairro:</label>
                    <input type="text" name="bairro" id="bairro" required>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-info">Enviar</button>
        </form>
    </section>

</body>
</html>
